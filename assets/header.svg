<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Venkateshwaran Mani, AI R&amp;D Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.6" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#101a12"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- live indicator -->
  <g transform="translate(40,38)">
    <circle r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="none" stroke="#ef4444" stroke-width="2">
      <animate attributeName="r" values="5;16" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="5" fill="#ffffff" fill-opacity="0.75" font-family="Courier New, monospace" font-size="14" letter-spacing="3">OPEN TO WORK</text>
  </g>

  <!-- name -->
  <text x="450" y="106" text-anchor="middle" fill="url(#name)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">
    VENKATESHWARAN MANI
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="142" text-anchor="middle" fill="#22c55e" font-family="Courier New, monospace" font-size="19" letter-spacing="4">
    AI R&amp;D ENGINEER
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="168" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-family="Courier New, monospace" font-size="14" letter-spacing="2">
    GENERATIVE AI  •  LLMs  •  RAG  •  AI AGENTS
  </text>

  <!-- ECG base line -->
  <path id="ecg" d="M0 220 H250 L275 220 L290 200 L305 220 L330 220 L350 236 L375 160 L400 252 L420 220 H470 L490 220 L505 205 L520 220 H900"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ECG moving pulse -->
  <path d="M0 220 H250 L275 220 L290 200 L305 220 L330 220 L350 236 L375 160 L400 252 L420 220 H470 L490 220 L505 205 L520 220 H900"
        pathLength="1000" fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="170 830" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="170;-830" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- traveling dot -->
  <circle r="5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#ecg"/>
    </animateMotion>
  </circle>
</svg>
